<svg viewBox="0 0 960 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="query-dark-title query-dark-desc" id="query-dark-root">
        <title id="query-dark-title">How a query runs</title>
        <desc id="query-dark-desc">A hybrid search embeds the query, takes 100 candidates from the 256-bit vectors and the rare-term index, decodes the first 128 tokens of each with the language model, reranks them and returns k items.</desc>
