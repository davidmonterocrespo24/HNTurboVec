      #query-dark-root { --color-paper: #1c1c1a; --color-ink: #f6f6ef; --color-muted: #c9c7bc; --color-accent: #ff7a1f;
            --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #query-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #query-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#query-dark-root .diagram-container { overflow-x: visible; }
