<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="build-dark-title build-dark-desc" id="build-dark-root">
        <title id="build-dark-title">How the block is built</title>
        <desc id="build-dark-desc">The monthly Parquet files are compressed by the language model, embedded on the integrated GPU and indexed in parallel, then packed month by month into one 5.07 GB block plus the query embedder.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #build-dark-root { --color-paper: #1c1c1a; --color-ink: #f6f6ef; --color-muted: #c9c7bc; --color-accent: #ff7a1f;
            --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #build-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #build-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#build-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="build-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c9c7bc"/></marker><marker id="build-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff7a1f"/></marker><marker id="build-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker></defs>
