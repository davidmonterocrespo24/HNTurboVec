<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="block-dark-title block-dark-desc" id="block-dark-root">
        <title id="block-dark-title">Inside the 5.34 GB block</title>
        <desc id="block-dark-desc">Treemap of the block by bytes: the LM-coded text is 53 percent, the semantic vectors 28 percent, the word index, the models and the metadata 5 to 7 percent each.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #block-dark-root { --color-paper: #1c1c1a; --color-ink: #f6f6ef; --color-muted: #c9c7bc; --color-accent: #ff7a1f;
            --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #block-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #block-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#block-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="block-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c9c7bc"/></marker><marker id="block-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff7a1f"/></marker><marker id="block-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker></defs>
        <rect width="100%" height="100%" fill="#1c1c1a"/>
        <rect x="40" y="40" width="476" height="380" rx="2" fill="#1c1c1a"/>
        <rect x="40" y="40" width="476" height="380" rx="2" data-share="52.65" fill="#ff6600" stroke="#ff7a1f" stroke-width="1.5" fill-opacity="0.18"/>
        <text x="56" y="68" fill="#f6f6ef" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600">Text</text>
        <text x="56" y="86" fill="#c9c7bc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">2.81 GB · 53%</text>
        <text x="56" y="100" fill="#c9c7bc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">coded by the LM · 59 B per item</text>
        <rect x="520" y="40" width="436" height="224" rx="2" fill="#1c1c1a"/>
        <rect x="520" y="40" width="436" height="224" rx="2" data-share="28.38" fill="#f6f6ef" stroke="#f6f6ef" stroke-width="1" fill-opacity="0.14" stroke-opacity="0.3"/>
        <text x="536" y="68" fill="#f6f6ef" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600">Semantic vectors</text>
        <text x="536" y="86" fill="#c9c7bc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">1.52 GB · 28%</text>
        <text x="536" y="100" fill="#c9c7bc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">256 bits per item</text>
        <rect x="520" y="268" width="156" height="152" rx="2" fill="#1c1c1a"/>
