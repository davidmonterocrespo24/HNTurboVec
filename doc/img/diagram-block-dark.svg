        <text x="536" y="296" fill="#f6f6ef" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">Word index</text>
        <text x="536" y="314" fill="#c9c7bc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">0.37 GB · 7%</text>
        <text x="536" y="328" fill="#c9c7bc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">4.2 M rare terms</text>
        <rect x="680" y="268" width="148" height="152" rx="2" fill="#1c1c1a"/>
        <rect x="680" y="268" width="148" height="152" rx="2" data-share="6.59" fill="#f6f6ef" stroke="#f6f6ef" stroke-width="1" fill-opacity="0.07" stroke-opacity="0.3"/>
