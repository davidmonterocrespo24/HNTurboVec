        <text x="696" y="328" fill="#c9c7bc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">embedder + LM</text>
        <rect x="832" y="268" width="124" height="152" rx="2" fill="#1c1c1a"/>
        <rect x="832" y="268" width="124" height="152" rx="2" data-share="5.55" fill="#f6f6ef" stroke="#f6f6ef" stroke-width="1" fill-opacity="0.04" stroke-opacity="0.3"/>
        <text x="848" y="296" fill="#f6f6ef" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600">Metadata</text>
        <text x="848" y="314" fill="#c9c7bc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">0.30 GB · 6%</text>
        <text x="848" y="328" fill="#c9c7bc" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">+ 12 MB directory</text>
        <line x1="40" y1="462" x2="960" y2="462" stroke="#f6f6ef" stroke-width="0.8" stroke-opacity="0.1"/>
        <text x="40" y="478" fill="#c9c7bc" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <text x="960" y="478" fill="#c9c7bc" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">AREA = BYTES · HN-2026-08.HNZ · 5,343,133,431 BYTES · OCT 2026</text>
        <rect x="40" y="488" width="16" height="10" rx="2" fill="#ff6600" stroke="#ff7a1f" stroke-width="1" fill-opacity="0.18"/>
        <text x="64" y="497" fill="#c9c7bc" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Text · the focal part, more than half the block</text>
        <rect x="300" y="488" width="16" height="10" rx="2" fill="#f6f6ef" stroke="#f6f6ef" stroke-width="1" fill-opacity="0.14" stroke-opacity="0.3"/>
        <text x="324" y="497" fill="#c9c7bc" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Other parts · stronger contrast is larger</text>
      </svg>
