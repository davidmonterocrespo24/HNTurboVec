[package]
name = "hnz-py"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Módulo de Python de hnz (PyO3): import hnz"

[lib]
name = "_hnz"
crate-type = ["cdylib"]

[dependencies]
hnz = { path = ".." }
# abi3: una sola rueda para Python >= 3.10; generate-import-lib: enlazar con python3.dll usando la
# toolchain GNU (MinGW) sin necesitar Visual Studio
pyo3 = { version = "0.29", features = ["abi3-py310", "generate-import-lib"] }
anyhow = "1"
serde_json = "1"
