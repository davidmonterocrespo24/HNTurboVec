[package]
name = "hnz-py"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python module of hnz (PyO3): import hnz"

[lib]
name = "_hnz"
crate-type = ["cdylib"]

[dependencies]
hnz = { path = ".." }
# abi3: a single wheel for Python >= 3.10; generate-import-lib: link against python3.dll with the
# GNU (MinGW) toolchain, without Visual Studio
pyo3 = { version = "0.29", features = ["abi3-py310", "generate-import-lib"] }
anyhow = "1"
serde_json = "1"
