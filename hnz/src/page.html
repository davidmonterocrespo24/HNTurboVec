<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hnz · buscar en Hacker News</title>
<style>
  :root { --bg:#f6f6ef; --fg:#222; --mut:#666; --acc:#ff6600; --card:#fff; --line:#e3e3dc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16161a; --fg:#e8e8e8; --mut:#9a9a9a; --acc:#ff8a3d; --card:#202024; --line:#333; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { background:var(--acc); color:#fff; padding:10px 16px; font-weight:700; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  form { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  input, select, button { font: inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  input[name=q] { flex: 1 1 320px; }
  input.small { width: 110px; }
  button { background:var(--acc); color:#fff; border:none; cursor:pointer; }
  .meta { color:var(--mut); font-size: 13px; }
  .r { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:10px 0; }
  .r h3 { margin:0 0 4px; font-size:16px; }
  .r a { color: inherit; }
  .txt { white-space: pre-wrap; margin-top:6px; }
  #stats { color:var(--mut); font-size:13px; min-height: 1.2em; }
</style>
</head>
<body>
<header>hnz — Hacker News comprimido</header>
<main>
<form id="f">
  <input name="q" placeholder="¿Qué buscas? (p.ej. rust async runtime)" autofocus>
  <input name="k" class="small" type="number" value="10" min="1" max="100" title="resultados">
  <input name="from" class="small" placeholder="desde (2015)">
  <input name="to" class="small" placeholder="hasta (2018-12)">
  <select name="type"><option value="">todo</option><option value="story">stories</option><option value="comment">comentarios</option><option value="job">jobs</option></select>
  <select name="mode"><option value="hybrid">híbrida</option><option value="vector">semántica</option><option value="keyword">palabras</option></select>
  <button>Buscar</button>
</form>
<div id="stats"></div>
<div id="res"></div>
</main>
<script>
const f = document.getElementById('f'), res = document.getElementById('res'), st = document.getElementById('stats');
const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
f.onsubmit = async e => {
  e.preventDefault();
  const p = new URLSearchParams(new FormData(f));
  st.textContent = 'buscando…';
  const t0 = performance.now();
  const r = await fetch('/search?' + p).then(x => x.json());
  if (r.error) { st.textContent = 'error: ' + r.error; res.innerHTML = ''; return; }
  st.textContent = `${r.results.length} resultados · servidor ${r.ms.total.toFixed(1)} ms (embedding ${r.ms.embedding.toFixed(1)}, búsqueda ${r.ms.search.toFixed(1)}, descompresión ${r.ms.fetch.toFixed(1)}) · navegador ${(performance.now()-t0).toFixed(0)} ms`;
  res.innerHTML = r.results.map(x => `
    <div class="r">
      <h3>${x.title ? `<a href="${esc(x.url || x.link)}" target="_blank">${esc(x.title)}</a>` : 're: ' + esc(x.story_title || '(hilo)')}</h3>
      <div class="meta">${x.kind} · ${esc(x.by)} · ${x.date} · ${x.points} pts · <a href="${x.link}" target="_blank">HN #${x.id}</a> · score ${x.score.toFixed(3)}</div>
      ${x.text ? `<div class="txt">${esc(x.text.length > 700 ? x.text.slice(0, 700) + '…' : x.text)}</div>` : ''}
    </div>`).join('');
};
</script>
</body>
</html>
