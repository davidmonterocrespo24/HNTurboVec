[package]
name = "hnz"
version = "0.1.0"
edition = "2021"
description = "Hacker News comprimido al máximo con búsqueda híbrida (vectores binarios + BM25) y recuperación literal"

[dependencies]
anyhow = "1"
arrow = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd", "snap"] }
zstd = "0.13"
memmap2 = "0.9"
rayon = "1.10"
fst = "0.4"
bitpacking = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
half = "2"
tiny_http = "0.12"
openvino = { version = "0.11", features = ["runtime-linking"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

[profile.dev]
opt-level = 1
