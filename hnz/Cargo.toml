[package]
name = "hnz"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Hacker News compressed to the limit, with hybrid search (binary vectors + BM25) and verbatim retrieval"

[workspace]
# py/: the Python package (PyO3); `cargo build` in this folder still builds only hnz
members = ["py"]

[dependencies]
anyhow = "1"
arrow = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd", "snap"] }
zstd = "0.13"
memmap2 = "0.9"
rayon = "1.10"
fst = "0.4"
bitpacking = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
half = "2"
openvino = { version = "0.11", features = ["runtime-linking"] }
# explicit loading of openvino_c.dll from ov_libs (embed.rs)
openvino-sys = { version = "0.11", features = ["runtime-linking"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
# XXH3 hashes of the block container (block.rs); already in the tree via parquet
twox-hash = { version = "2.1", default-features = false, features = ["std", "xxhash3_64", "xxhash3_128"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

[profile.dev]
opt-level = 1

[target.'cfg(windows)'.dependencies]
# process memory (RAM budget, mem.rs)
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
